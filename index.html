<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>For Bella ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

background:#000;
overflow:hidden;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
color:white;

}

canvas{

position:fixed;
left:0;
top:0;
width:100%;
height:100%;
z-index:0;

}

#intro{

position:relative;
z-index:2;
text-align:center;

animation:fade 2s;

}

#heart{

font-size:90px;

animation:beat 1.4s infinite;

filter:drop-shadow(0 0 20px #ff2d55);

}

h1{

font-size:72px;

letter-spacing:12px;

margin-top:20px;

font-weight:700;

}

p{

margin-top:20px;

font-size:28px;

font-weight:300;

opacity:.85;

}

button{

margin-top:60px;

padding:18px 50px;

font-size:20px;

border:none;

border-radius:60px;

cursor:pointer;

background:linear-gradient(45deg,#ff2d55,#ff6b81);

color:white;

transition:.4s;

box-shadow:0 0 40px rgba(255,45,85,.45);

}

button:hover{

transform:scale(1.08);

box-shadow:0 0 70px rgba(255,45,85,.9);

}

@keyframes beat{

0%{transform:scale(1);}
50%{transform:scale(1.18);}
100%{transform:scale(1);}

}

@keyframes fade{

from{

opacity:0;

transform:translateY(40px);

}

to{

opacity:1;

transform:translateY(0);

}

}

</style>

</head>

<body>

<canvas id="stars"></canvas>

<div id="intro">

<div id="heart">❤️</div>

<h1>BELLA</h1>

<p>Just trust me for one minute...</p>

<button id="open">

Open Your Heart ❤️

</button>

</div>

<script>

const canvas=document.getElementById("stars");

const ctx=canvas.getContext("2d");

function resize(){

canvas.width=window.innerWidth;

canvas.height=window.innerHeight;

}

resize();

window.onresize=resize;

let stars=[];

for(let i=0;i<250;i++){

stars.push({

x:Math.random()*canvas.width,

y:Math.random()*canvas.height,

r:Math.random()*2,

v:Math.random()*0.6+.1,

a:Math.random()

});

}

function animate(){

ctx.clearRect(0,0,canvas.width,canvas.height);

stars.forEach(s=>{

ctx.beginPath();

ctx.fillStyle="rgba(255,255,255,"+s.a+")";

ctx.arc(s.x,s.y,s.r,0,Math.PI*2);

ctx.fill();

s.y+=s.v;

if(s.y>canvas.height){

s.y=0;

s.x=Math.random()*canvas.width;

}

});

requestAnimationFrame(animate);

}

animate();

document.getElementById("open").onclick=function(){

document.body.style.transition="2s";

document.body.style.background="#05010d";

document.getElementById("intro").innerHTML=`

<div style="font-size:70px;line-height:1.6;animation:fade 2s;">

I just wanted to give you

<br><br>

a little moment...

<br><br>

<span style="color:#ff5f8f;">

Because you make my days

so much brighter. ❤️

</span>

</div>

`;

};

</script>

</body>

</html>
