<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #05020a;
            font-family: 'Arial', sans-serif;
            color: #fff;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            text-align: center;
            pointer-events: none;
        }

        h1 {
            font-size: 3rem;
            color: #ff4d94;
            text-shadow: 0 0 20px rgba(255, 77, 148, 0.8);
            margin: 0;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="overlay">
        <h1 id="main-title">I LOVE YOU SO MUCH</h1>
    </div>

    <div id="canvas-container"></div>

    <!-- Importing Three.js for 3D graphics and floating text effects -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        // Basic 3D scene setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        camera.position.z = 500;

        // List of phrases floating in space (in English)
        const messages = [
            "I LOVE YOU", "FOREVER", "❤️", "MY LOVE", 
            "ALWAYS", "YOU & ME", "BEAUTIFUL", "SO MUCH"
        ];

        // Function to create textures with floating text
        function createTextTexture(text) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.font = 'Bold 40px Arial';
            ctx.fillStyle = '#ffb3de';
            ctx.textAlign = 'center';
            ctx.shadowColor = '#ff1493';
            ctx.shadowBlur = 15;
            ctx.fillText(text, canvas.width / 2, canvas.height / 2);

            const texture = new THREE.CanvasTexture(canvas);
            return texture;
        }

        const elements = [];

        // Create random floating elements
        for (let i = 0; i < 40; i++) {
            const text = messages[Math.floor(Math.random() * messages.length)];
            const texture = createTextTexture(text);
            const material = new THREE.MeshBasicMaterial({ 
                map: texture, 
                transparent: true,
                side: THREE.DoubleSide 
            });
            
            const geometry = new THREE.PlaneGeometry(120, 60);
            const mesh = new THREE.Mesh(geometry, material);

            mesh.position.x = (Math.random() - 0.5) * 1000;
            mesh.position.y = (Math.random() - 0.5) * 1000;
            mesh.position.z = (Math.random() - 0.5) * 1000;

            scene.add(mesh);
            elements.push({ mesh, speed: Math.random() * 2 + 1 });
        }

        // Smooth animation moving towards the camera
        function animate() {
            requestAnimationFrame(animate);

            elements.forEach(item => {
                item.mesh.position.z += item.speed;
                // If it passes the camera, reset it to the background
                if (item.mesh.position.z > 400) {
                    item.mesh.position.z = -600;
                    item.mesh.position.x = (Math.random() - 0.5) * 1000;
                    item.mesh.position.y = (Math.random() - 0.5) * 1000;
                }
            });

            renderer.render(scene, camera);
        }

        animate();

        // Adjust screen size dynamically
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
